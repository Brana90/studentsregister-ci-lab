# CI for StudentsRegister on GitHub Actions: test, then build and scan the image
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
  image:
    needs: test
    runs-on: ubuntu-24.04
    env:
      TRIVY: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build -t studentsregister:${{ github.sha }} .
      - name: Scan the image
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro $TRIVY image
          --scanners vuln --pkg-types os --ignore-unfixed --exit-code 1
          --severity CRITICAL studentsregister:${{ github.sha }}
