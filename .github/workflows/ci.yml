# CI for StudentsRegister on GitHub Actions: test, build and scan the image, then publish it after an approval
name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
  image:
    needs: test
    runs-on: ubuntu-24.04
    env:
      TRIVY: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: |
          for try in 1 2 3 4 5; do
            docker build -t studentsregister:${{ github.sha }} . && break
            echo "build failed (try $try), retrying in 30 s"; sleep 30
          done
      - name: Scan the image
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro $TRIVY image
          --scanners vuln --pkg-types os --ignore-unfixed --exit-code 1
          --severity CRITICAL studentsregister:${{ github.sha }}
  publish:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      LAB_NOTIFY_TOKEN: ${{ secrets.LAB_NOTIFY_TOKEN }}
      IMAGE: ghcr.io/brana90/studentsregister-ci-lab:${{ github.sha }}
    steps:
      - name: Check the notify secret
        run: |
          echo "notify token length: ${#LAB_NOTIFY_TOKEN}"
          test "${#LAB_NOTIFY_TOKEN}" -gt 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image
        run: |
          for try in 1 2 3 4 5; do
            docker build -t "$IMAGE" . && break
            echo "build failed (try $try), retrying in 30 s"; sleep 30
          done
          docker push "$IMAGE"
