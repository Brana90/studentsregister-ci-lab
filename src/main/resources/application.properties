# Server
server.port=8080

# MySQL - Tailscale IP
# Host, port, database and user have lab defaults so local runs work; Docker/K8s env vars
# override them. The password has NO default: set MYSQL_PASSWORD (the app refuses to start without it).
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:100.105.204.3}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:student_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:student_user}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# App name
spring.application.name=student-register

# Lab / classroom switch: OPEN_ACCESS=true opens the app without a sign-in page,
# as OPEN_ACCESS_USER (the seeded admin). Off by default - never turn it on for
# an app that real users can reach.
app.open-access=${OPEN_ACCESS:false}
app.open-access-user=${OPEN_ACCESS_USER:admin}