# The "test" profile (@ActiveProfiles("test")): the tests run against an in-memory H2 database,
# so a build server needs no MySQL. Nothing secret here: H2 makes the database on first use.
spring.datasource.url=jdbc:h2:mem:studentregister;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
